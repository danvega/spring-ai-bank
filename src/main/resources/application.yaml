spring:
  application:
    name: bank
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        # Astra needs the Responses API to call tools
        api: responses
        model: gpt-6-astra
      responses:
        model: gpt-6-astra
        reasoning-effort: low

    tools:
      limits:
        max-calls-per-tool-default: 5
        max-calls-per-tool:
          # Brackets keep the camel-case key
          "[proposeDispute]": 1
        max-total-tool-calls: 10
        on-limit-exceeded: return-error-response

# Localhost only, no auth
server:
  port: 8099
  address: 127.0.0.1

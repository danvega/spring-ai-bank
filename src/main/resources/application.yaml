spring:
  application:
    name: bank
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        # Astra needs the Responses API to call tools
        api: responses
        # Models: gpt-6-astra (most capable), gpt-6.1-sol (balanced), gpt-6-luna (fastest, cheapest)
        model: gpt-6-astra
      responses:
        model: gpt-6-astra
        reasoning-effort: low

    tools:
      limits:
        max-calls-per-tool-default: 5
        max-calls-per-tool:
          # At most one dispute proposal per message, so the model can't propose a pile of them.
          # The brackets keep the camel-case name as the key.
          "[proposeDispute]": 1
        max-total-tool-calls: 10
        on-limit-exceeded: return-error-response

    mcp:
      server:
        name: bank
        version: 1.0.0
        instructions: "Look up card transactions and disputes for a bank's back office. All data is made up."
        # Required, or /mcp is a 404
        protocol: STREAMABLE

    # Or a local Ollama (model: nimble) or Laya server
    typesafe:
      api-key: ${TYPESAFE_API_KEY}
      model: jev-1.13.0

bank:
  memory:
    root: ${BANK_MEMORY_ROOT:./memories}

server:
  port: 8099

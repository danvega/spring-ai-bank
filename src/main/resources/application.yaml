spring:
  application:
    name: bank
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        # Astra needs the Responses API to call tools
        api: responses
        # Models: gpt-6-astra (most capable), gpt-6.1-sol (balanced), gpt-6-luna (fastest, cheapest)
        model: gpt-6-astra
      responses:
        model: gpt-6-astra
        reasoning-effort: low

    tools:
      limits:
        max-calls-per-tool-default: 5
        max-calls-per-tool:
          # Brackets keep the camel-case key
          "[proposeDispute]": 1
        max-total-tool-calls: 10
        on-limit-exceeded: return-error-response

    mcp:
      server:
        name: bank
        version: 1.0.0
        instructions: "Look up card transactions and disputes for a bank's back office. All data is made up."
        # Required, or /mcp is a 404
        protocol: STREAMABLE

bank:
  memory:
    root: ${BANK_MEMORY_ROOT:./memories}

server:
  port: 8099

spring.application.name=bank

# Port 8099 (8080 is often taken). Bind to localhost only: this demo has no auth.
server.port=8099
server.address=127.0.0.1

# OpenAI through the Responses API (new in Spring AI 2.1.0-M1).
# GPT-6 Astra and GPT-6.1 Sol need Responses for tool calling.
# The app starts without a key, so the non-LLM parts still work.
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
spring.ai.openai.chat.api=responses
# gpt-6.1-sol (default) or gpt-6-astra
spring.ai.openai.responses.model=${OPENAI_MODEL:gpt-6.1-sol}
# low keeps live demos fast. 6.1 Sol defaults to medium.
spring.ai.openai.responses.reasoning-effort=low
